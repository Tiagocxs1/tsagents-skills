name: Google Trends tooling — checks

on:
  pull_request:
    paths:
      - "google-trends-research/**"
      - ".github/workflows/google-trends-collect.yml"
  push:
    branches: [main]
    paths:
      - "google-trends-research/**"
      - ".github/workflows/google-trends-collect.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile google-trends-research/scripts/collect_google_trends.py
      - name: Unit tests
        working-directory: google-trends-research/scripts
        run: python -m unittest -v
      - name: Validate example project config
        run: |
          python google-trends-research/scripts/collect_google_trends.py \
            --config google-trends-research/templates/config.example.json \
            --validate-only
