name: Deploy MCP Brasil

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirmar publicação do MCP Brasil no Cloudflare Workers"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MCP_BRASIL_API_TOKEN: ${{ secrets.MCP_BRASIL_API_TOKEN }}

    steps:
      - name: Checkout runtime and pinned MCP Brasil source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required upstream submodule
        run: git submodule update --init upstream/mcp-brasil

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: runtimes/cloudflare-mcp-brasil/pyproject.toml

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Actions variable: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MCP_BRASIL_API_TOKEN" || { echo "Missing Actions secret: MCP_BRASIL_API_TOKEN"; exit 1; }
          test "${#MCP_BRASIL_API_TOKEN}" -ge 32 || { echo "MCP_BRASIL_API_TOKEN must have at least 32 characters"; exit 1; }

      - name: Install Python Worker dependencies
        working-directory: runtimes/cloudflare-mcp-brasil
        run: uv sync --all-groups

      - name: Store the MCP Bearer token as a Cloudflare Worker Secret
        working-directory: runtimes/cloudflare-mcp-brasil
        run: |
          printf '%s' "$MCP_BRASIL_API_TOKEN" | uv run pywrangler secret put MCP_BRASIL_API_TOKEN

      - name: Deploy remote MCP server
        working-directory: runtimes/cloudflare-mcp-brasil
        run: uv run pywrangler deploy
