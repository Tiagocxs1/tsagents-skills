name: Technical SEO tooling — checks

on:
  pull_request:
    paths:
      - "technical-seo-audit/**"
      - ".github/workflows/lighthouse-collect.yml"
      - ".github/workflows/technical-seo-tooling-ci.yml"
  push:
    branches: [main]
    paths:
      - "technical-seo-audit/**"
      - ".github/workflows/lighthouse-collect.yml"
      - ".github/workflows/technical-seo-tooling-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile runner
        run: python -m py_compile technical-seo-audit/scripts/run_lighthouse.py
      - name: Unit tests
        working-directory: technical-seo-audit/scripts
        run: python -m unittest -v
      - name: Validate example config
        run: |
          python technical-seo-audit/scripts/run_lighthouse.py \
            --config technical-seo-audit/templates/config-lighthouse.json \
            --validate-only
