name: Google Trends — reusable collector

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the caller repository's private JSON config.
        required: false
        type: string
        default: .seo/google-trends.json
      report_branch:
        description: Dedicated report branch; never the production branch.
        required: false
        type: string
        default: seo-reports
      report_root:
        description: Report directory inside the report branch.
        required: false
        type: string
        default: reports/seo/google-trends

permissions:
  contents: write

concurrency:
  group: google-trends-${{ github.repository }}-${{ inputs.config_path }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out caller project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: project
          persist-credentials: true

      - name: Check out public TS Trends tooling
        run: git clone --depth 1 https://github.com/Tiagocxs1/tsagents-skills.git tooling

      - name: Validate workflow paths and report branch
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          REPORT_BRANCH: ${{ inputs.report_branch }}
          REPORT_ROOT: ${{ inputs.report_root }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          for name in ("CONFIG_PATH", "REPORT_ROOT"):
              value = os.environ[name]
              path = PurePosixPath(value)
              if not value or path.is_absolute() or any(part in ("", ".", "..") for part in path.parts):
                  raise SystemExit(f"Unsafe relative path in {name}: {value!r}")

          branch = os.environ["REPORT_BRANCH"]
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", branch) or ".." in branch or branch.startswith("/") or branch.endswith("/"):
              raise SystemExit(f"Unsafe report branch: {branch!r}")
          if branch in {"main", "master", "production"}:
              raise SystemExit("Reports must not be written to a production branch.")
          PY

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Trends library
        run: python -m pip install --disable-pip-version-check "trendspyg==1.9.0"

      - name: Validate private project config
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          python tooling/google-trends-research/scripts/collect_google_trends.py \
            --config "project/$CONFIG_PATH" \
            --validate-only

      - name: Collect one bounded Trends snapshot
        id: collect
        continue-on-error: true
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          python tooling/google-trends-research/scripts/collect_google_trends.py \
            --config "project/$CONFIG_PATH" \
            --output-dir "$RUNNER_TEMP/google-trends-output"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-trends-${{ github.repository_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/google-trends-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Persist report to a separate branch
        if: always()
        working-directory: project
        env:
          REPORT_BRANCH: ${{ inputs.report_branch }}
          REPORT_ROOT: ${{ inputs.report_root }}
          SOURCE_DIR: ${{ runner.temp }}/google-trends-output
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "No Trends report was generated."
            exit 0
          fi
          git fetch origin "$REPORT_BRANCH:refs/remotes/origin/$REPORT_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$REPORT_BRANCH"; then
            git checkout -B "$REPORT_BRANCH" "refs/remotes/origin/$REPORT_BRANCH"
          else
            git checkout --orphan "$REPORT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          DEST="$REPORT_ROOT/run-$GITHUB_RUN_ID"
          mkdir -p "$DEST"
          cp -a "$SOURCE_DIR/." "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "No new report files to commit."
            exit 0
          fi
          git commit -m "chore(seo): Google Trends snapshot $GITHUB_RUN_ID"
          git push origin "HEAD:$REPORT_BRANCH"

      - name: Fail the workflow if collection failed
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo "Google Trends collection failed or was throttled. Review the logs; do not retry in a loop."
          exit 1
