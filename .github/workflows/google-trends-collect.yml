name: Google Trends — reusable collector

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the caller repository's private JSON config.
        required: false
        type: string
        default: .seo/google-trends.json
      output_dir:
        description: Report directory inside the caller repository.
        required: false
        type: string
        default: reports/seo/google-trends
    permissions:
      contents: write

permissions:
  contents: write

concurrency:
  group: google-trends-${{ github.repository }}-${{ inputs.config_path }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out caller project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: project
          persist-credentials: true

      - name: Check out public TS Trends tooling
        run: |
          git clone --depth 1 https://github.com/Tiagocxs1/tsagents-skills.git tooling

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned Trends library
        run: python -m pip install --disable-pip-version-check "trendspyg==1.9.0"

      - name: Validate private project config
        run: |
          python tooling/google-trends-research/scripts/collect_google_trends.py \
            --config "project/${{ inputs.config_path }}" \
            --validate-only

      - name: Collect one bounded Trends snapshot
        run: |
          python tooling/google-trends-research/scripts/collect_google_trends.py \
            --config "project/${{ inputs.config_path }}" \
            --output-dir "project/${{ inputs.output_dir }}"

      - name: Commit report to caller repository
        working-directory: project
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore(seo): monthly Google Trends snapshot"
          git push
