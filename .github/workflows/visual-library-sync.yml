name: Sync Public Visual Asset Library

on:
  push:
    branches:
      - main
      - feat/online-visual-library-sync-2026-11-24
    paths:
      - "vector-studio/asset-library/**"
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: public-visual-library-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download, validate and publish CC0/MIT visual assets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install sync dependency
        run: |
          python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Verify OIDC context and sync the public library
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python vector-studio/asset-library/sync_public_library.py

      - name: Preserve sync report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-library-sync-report
          path: vector-studio/asset-library/sync-report.json
          if-no-files-found: ignore
          retention-days: 30
